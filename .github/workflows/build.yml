name: Build SDL3

on:
  workflow_dispatch:
  push:
    tags:
      - "sdl3-*"

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          tr -d '\r' < apt-packages.txt | xargs sudo apt-get install -y --no-install-recommends

      - name: Configure
        run: |
          cmake -S SDL -B "build-${{ matrix.name }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install/${{ matrix.name }}" \
            -DSDL_SHARED=ON -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_INSTALL_TESTS=OFF \
            -DSDL_X11_XTEST=OFF \
            -DSDL_OPENGL=ON -DSDL_VULKAN=ON

      - name: Build
        run: cmake --build "build-${{ matrix.name }}" --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install
        run: cmake --install "build-${{ matrix.name }}" --config ${{ env.BUILD_TYPE }}

      - name: List output
        run: find "install/${{ matrix.name }}" -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SDL3-${{ matrix.name }}
          path: install/${{ matrix.name }}

  macos:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: osx-x64
            arch: x86_64
            deployment_target: "10.14"
          - name: osx-arm64
            arch: arm64
            deployment_target: "11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S SDL -B "build-${{ matrix.name }}" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install/${{ matrix.name }}" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }} \
            -DSDL_SHARED=ON -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_INSTALL_TESTS=OFF

      - name: Build
        run: cmake --build "build-${{ matrix.name }}" --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install
        run: cmake --install "build-${{ matrix.name }}" --config ${{ env.BUILD_TYPE }}

      - name: List output
        run: find "install/${{ matrix.name }}" -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SDL3-${{ matrix.name }}
          path: install/${{ matrix.name }}

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            arch: x64
          - name: win-arm64
            arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          cmake -S SDL -B "build-${{ matrix.name }}" -A ${{ matrix.arch }} `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\install\${{ matrix.name }}" `
            -DSDL_SHARED=ON `
            -DSDL_STATIC=ON `
            -DSDL_TESTS=OFF `
            -DSDL_INSTALL_TESTS=OFF `
            -DSDL_OPENGL=ON `
            -DSDL_VULKAN=ON `
            -DSDL_RENDER_D3D11=ON `
            -DSDL_RENDER_D3D12=ON

      - name: Build
        shell: pwsh
        run: cmake --build "build-${{ matrix.name }}" --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install
        shell: pwsh
        run: cmake --install "build-${{ matrix.name }}" --config ${{ env.BUILD_TYPE }}

      - name: List output
        shell: pwsh
        run: Get-ChildItem -Recurse "install\${{ matrix.name }}" -File | ForEach-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SDL3-${{ matrix.name }}
          path: install/${{ matrix.name }}

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: SDL3-*
          path: dist

      - name: Package full archives
        run: |
          cd dist
          for d in SDL3-*; do
            if [[ "$d" == SDL3-win-* ]]; then
              (cd "$d" && zip -r "../$d.zip" .)
            else
              tar -czf "$d.tar.gz" -C "$d" .
            fi
          done

      - name: Package runtime-only archives
        run: |
          set -euo pipefail
          mkdir -p runtime
          for d in dist/SDL3-*/; do
            d="${d%/}"
            p="$(basename "$d")"; p="${p#SDL3-}"
            mkdir -p "runtime/$p"
            case "$p" in
              linux-*) src="$(find -L "$d" -type f -name 'libSDL3.so.0.*' | head -n1)"; dst=libSDL3.so ;;
              osx-*)   src="$(find -L "$d" -type f -name 'libSDL3.*.dylib' | head -n1)"; dst=libSDL3.dylib ;;
              win-*)   src="$(find -L "$d" -type f -name 'SDL3.dll' | head -n1)"; dst=SDL3.dll ;;
            esac
            [[ -n "${src:-}" ]] || { echo "No library found in $d" >&2; exit 1; }
            cp -L "$src" "runtime/$p/$dst"
            src=""
          done
          cd runtime
          for p in */; do
            p="${p%/}"
            if [[ "$p" == win-* ]]; then
              (cd "$p" && zip -j "../SDL3-$p-runtime.zip" ./*)
            else
              tar -czf "SDL3-$p-runtime.tar.gz" -C "$p" .
            fi
          done
          ls -la
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            runtime/*.zip
            runtime/*.tar.gz
          generate_release_notes: true
